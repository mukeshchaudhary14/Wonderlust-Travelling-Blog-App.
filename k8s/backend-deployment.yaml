apiVersion: apps/v1
kind: Deployment
metadata:
  name: wonderlust-backend
  namespace: wonderlust
  labels:
    app.kubernetes.io/name: wonderlust-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: wonderlust
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: wonderlust-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wonderlust-backend
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: mukeshchaudhary14/wonderlust-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: wonderlust-config
            - secretRef:
                name: wonderlust-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
