apiVersion: apps/v1
kind: Deployment
metadata:
  name: wonderlust-frontend
  namespace: wonderlust
  labels:
    app.kubernetes.io/name: wonderlust-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: wonderlust
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: wonderlust-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wonderlust-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: mukeshchaudhary14/wonderlust-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
