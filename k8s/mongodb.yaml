apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wonderlust-mongodb-pvc
  namespace: wonderlust
  labels:
    app.kubernetes.io/name: wonderlust-mongodb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wonderlust-mongodb
  namespace: wonderlust
  labels:
    app.kubernetes.io/name: wonderlust-mongodb
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wonderlust-mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wonderlust-mongodb
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
              name: mongodb
          env:
            - name: MONGO_INITDB_DATABASE
              value: wanderlust
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: mongodb-storage
          persistentVolumeClaim:
            claimName: wonderlust-mongodb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: wonderlust-mongodb
  namespace: wonderlust
  labels:
    app.kubernetes.io/name: wonderlust-mongodb
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP
      name: mongodb
  selector:
    app.kubernetes.io/name: wonderlust-mongodb
