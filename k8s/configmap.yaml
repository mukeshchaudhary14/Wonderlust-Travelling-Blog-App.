apiVersion: v1
kind: ConfigMap
metadata:
  name: wonderlust-config
  namespace: wonderlust
  labels:
    app.kubernetes.io/name: wonderlust
    app.kubernetes.io/component: config
data:
  PORT: "5000"
  NODE_ENV: "production"
  MONGODB_URI: "mongodb://wonderlust-mongodb:27017/wanderlust"
  REDIS_URL: "redis://wonderlust-redis:6379"
  FRONTEND_URL: "http://wonderlust.local"
  BACKEND_URL: "http://wonderlust.local/api"
  ACCESS_COOKIE_MAXAGE: "120000"
  ACCESS_TOKEN_EXPIRES_IN: "120s"
  REFRESH_COOKIE_MAXAGE: "120000"
  REFRESH_TOKEN_EXPIRES_IN: "120s"
