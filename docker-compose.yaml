version: '3.8'

services:
  # =========================================================================
  # MongoDB Database Service
  # =========================================================================
  mongo:
    image: mongo:7.0
    container_name: wonderlust-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=wanderlust
    volumes:
      - mongo-data:/data/db
    networks:
      - wonderlust-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =========================================================================
  # Redis Cache Service
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: wonderlust-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - wonderlust-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Backend API Service (Node.js/Express + TypeScript)
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mukeshchaudhary14/wonderlust-backend:latest
    container_name: wonderlust-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/wanderlust
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=wonderlust_super_secure_jwt_secret_devops_key_2026
      - FRONTEND_URL=http://localhost:3000
      - BACKEND_URL=http://localhost:5000
      - ACCESS_COOKIE_MAXAGE=120000
      - ACCESS_TOKEN_EXPIRES_IN=120s
      - REFRESH_COOKIE_MAXAGE=120000
      - REFRESH_TOKEN_EXPIRES_IN=120s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wonderlust-network

  # =========================================================================
  # Frontend Client Service (React 18 + Vite + Nginx)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_PATH=""
    image: mukeshchaudhary14/wonderlust-frontend:latest
    container_name: wonderlust-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wonderlust-network

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local

networks:
  wonderlust-network:
    driver: bridge
