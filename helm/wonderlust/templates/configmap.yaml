apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wonderlust.fullname" . }}-config
  labels:
    {{- include "wonderlust.labels" . | nindent 4 }}
data:
  PORT: "{{ .Values.backend.service.port }}"
  NODE_ENV: "{{ .Values.global.environment }}"
  MONGODB_URI: "mongodb://{{ include "wonderlust.fullname" . }}-mongodb:27017/wanderlust"
  REDIS_URL: "redis://{{ include "wonderlust.fullname" . }}-redis:6379"
  FRONTEND_URL: "http://{{ (index .Values.ingress.hosts 0).host }}"
  BACKEND_URL: "http://{{ (index .Values.ingress.hosts 0).host }}/api"
  ACCESS_COOKIE_MAXAGE: "120000"
  ACCESS_TOKEN_EXPIRES_IN: "120s"
  REFRESH_COOKIE_MAXAGE: "120000"
  REFRESH_TOKEN_EXPIRES_IN: "120s"
