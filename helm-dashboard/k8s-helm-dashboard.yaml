apiVersion: v1
kind: Namespace
metadata:
  name: helm-dashboard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helm-dashboard-sa
  namespace: helm-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: helm-dashboard-binding
subjects:
  - kind: ServiceAccount
    name: helm-dashboard-sa
    namespace: helm-dashboard
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-dashboard
  namespace: helm-dashboard
  labels:
    app: helm-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helm-dashboard
  template:
    metadata:
      labels:
        app: helm-dashboard
    spec:
      serviceAccountName: helm-dashboard-sa
      containers:
        - name: helm-dashboard
          image: komodorio/helm-dashboard:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: helm-dashboard-service
  namespace: helm-dashboard
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30085
      protocol: TCP
      name: http
  selector:
    app: helm-dashboard
